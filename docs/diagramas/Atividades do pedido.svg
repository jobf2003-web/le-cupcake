<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 820" width="1070" height="820"><rect width="1070" height="820" fill="#fff"/><style>text{font:16px Arial,Helvetica,sans-serif;fill:#203443}.heading{font:bold 25px Arial}.small{font:13px Arial;fill:#64748b}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#35738a"/></marker></defs><text class="heading" x="37" y="44">Atividades do pedido</text><rect x="386" y="70" width="280" height="52" rx="9" fill="#edf4f7" stroke="#35738a" stroke-width="1.6"/><text x="526" y="101" text-anchor="middle">Pedido registrado</text><path d="M526 144.5L666 192L526 239.5L386 192Z" fill="#f4f7f9" stroke="#35738a" stroke-width="1.8"/><text x="526" y="197" text-anchor="middle">Forma de pagamento?</text><rect x="76" y="281" width="340" height="55" rx="9" fill="#edf4f7" stroke="#35738a" stroke-width="1.6"/><text x="246" y="313.5" text-anchor="middle">PIX ou cartão demonstrativo</text><rect x="672" y="281" width="326" height="55" rx="9" fill="#edf4f7" stroke="#35738a" stroke-width="1.6"/><text x="835" y="313.5" text-anchor="middle">Pagamento a combinar</text><line x1="526" y1="122" x2="526" y2="143" stroke="#35738a" stroke-width="2" marker-end="url(#arr)"/><line x1="428" y1="215" x2="250" y2="281" stroke="#35738a" stroke-width="2" marker-end="url(#arr)"/><text class="small" x="339" y="238" text-anchor="middle">demonstrativo</text><line x1="624" y1="215" x2="835" y2="281" stroke="#35738a" stroke-width="2" marker-end="url(#arr)"/><text class="small" x="729.5" y="238" text-anchor="middle">a combinar</text><path d="M247 380L382 428L247 476L112 428Z" fill="#f4f7f9" stroke="#35738a" stroke-width="1.8"/><text x="247" y="433" text-anchor="middle">Decisão no simulador</text><line x1="247" y1="336" x2="247" y2="380" stroke="#35738a" stroke-width="2" marker-end="url(#arr)"/><rect x="75" y="526" width="344" height="55" rx="9" fill="#edf4f7" stroke="#35738a" stroke-width="1.6"/><text x="247" y="558.5" text-anchor="middle">Aprovação simulada</text><rect x="662" y="526" width="342" height="55" rx="9" fill="#fff3ee" stroke="#35738a" stroke-width="1.6"/><text x="833" y="558.5" text-anchor="middle">Recusa e cancelamento</text><line x1="247" y1="476" x2="247" y2="526" stroke="#35738a" stroke-width="2" marker-end="url(#arr)"/><text class="small" x="247" y="491" text-anchor="middle">aprova</text><line x1="380" y1="428" x2="831" y2="526" stroke="#35738a" stroke-width="2" marker-end="url(#arr)"/><text class="small" x="605.5" y="467" text-anchor="middle">recusa</text><rect x="363" y="629" width="326" height="55" rx="9" fill="#edf4f7" stroke="#35738a" stroke-width="1.6"/><text x="526" y="661.5" text-anchor="middle">Confirma pedido e inicia preparo</text><line x1="247" y1="581" x2="450" y2="629" stroke="#35738a" stroke-width="2" marker-end="url(#arr)"/><line x1="835" y1="336" x2="835" y2="628" stroke="#35738a" stroke-width="2" marker-end="url(#arr)"/><line x1="835" y1="628" x2="690" y2="656" stroke="#35738a" stroke-width="2" marker-end="url(#arr)"/><text class="small" x="762.5" y="632" text-anchor="middle">fluxo de pedido</text><rect x="365" y="719" width="324" height="54" rx="9" fill="#edf4f7" stroke="#35738a" stroke-width="1.6"/><text x="527" y="751" text-anchor="middle">Pronto e entrega demonstrativa</text><line x1="526" y1="684" x2="526" y2="719" stroke="#35738a" stroke-width="2" marker-end="url(#arr)"/><text class="small" x="38" y="804">Sem cobrança real. Cancelamento é bloqueado após o início do preparo.</text></svg>