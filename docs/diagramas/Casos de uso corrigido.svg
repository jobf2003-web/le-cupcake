<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #18313f; }
    .subtitle { font: 400 14px Arial, Helvetica, sans-serif; fill: #5c7380; }
    .box-title { font: 700 15px Arial, Helvetica, sans-serif; fill: #16313c; }
    .box-title-dark { font: 700 15px Arial, Helvetica, sans-serif; fill: #ffffff; }
    .box-text { font: 400 12px Arial, Helvetica, sans-serif; fill: #1f3a45; }
    .label { font: 400 12px Arial, Helvetica, sans-serif; fill: #425c69; }
    .actor-label { font: 700 15px Arial, Helvetica, sans-serif; fill: #16313c; }
    .note { font: 400 12px Arial, Helvetica, sans-serif; fill: #5d727c; }
    .small { font: 400 11px Arial, Helvetica, sans-serif; fill: #5d727c; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#69858e" />
    </marker>
  </defs>
  <text x="36" y="40" class="title">Casos de uso — versão 0.2</text>
  <text x="36" y="64" class="subtitle">Fluxos principais do cliente e do administrador na aplicação Le Cupcake.</text>

  <rect x="225" y="92" width="830" height="735" rx="14" fill="#f8fbfc" stroke="#8ba5af" stroke-width="2"/>
  <text x="247" y="122" class="box-title">Le Cupcake</text>

  <circle cx="98" cy="255" r="22" fill="#ffffff" stroke="#1f6573" stroke-width="3"/>
  <line x1="98" y1="277" x2="98" y2="337" stroke="#1f6573" stroke-width="3"/>
  <line x1="64" y1="297" x2="132" y2="297" stroke="#1f6573" stroke-width="3"/>
  <line x1="98" y1="337" x2="68" y2="380" stroke="#1f6573" stroke-width="3"/>
  <line x1="98" y1="337" x2="128" y2="380" stroke="#1f6573" stroke-width="3"/>
  <text x="98" y="410" text-anchor="middle" class="actor-label">Cliente</text>


  <circle cx="1183" cy="255" r="22" fill="#ffffff" stroke="#1f6573" stroke-width="3"/>
  <line x1="1183" y1="277" x2="1183" y2="337" stroke="#1f6573" stroke-width="3"/>
  <line x1="1149" y1="297" x2="1217" y2="297" stroke="#1f6573" stroke-width="3"/>
  <line x1="1183" y1="337" x2="1153" y2="380" stroke="#1f6573" stroke-width="3"/>
  <line x1="1183" y1="337" x2="1213" y2="380" stroke="#1f6573" stroke-width="3"/>
  <text x="1183" y="410" text-anchor="middle" class="actor-label">Administrador</text>

  <ellipse cx="395" cy="185" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="395" y="185" text-anchor="middle" class="box-text">Consultar catálogo</text>
  <ellipse cx="640" cy="185" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="640" y="185" text-anchor="middle" class="box-text">Filtrar produtos</text>
  <ellipse cx="885" cy="185" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="885" y="185" text-anchor="middle" class="box-text">Visualizar detalhes</text>
  <ellipse cx="395" cy="305" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="395" y="305" text-anchor="middle" class="box-text">Montar carrinho</text>
  <ellipse cx="640" cy="305" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="640" y="305" text-anchor="middle" class="box-text">Aplicar cupom</text>
  <ellipse cx="885" cy="305" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="885" y="297" text-anchor="middle" class="box-text">Escolher entrega</text>
  <text x="885" y="315" text-anchor="middle" class="box-text">ou retirada</text>
  <ellipse cx="395" cy="425" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="395" y="425" text-anchor="middle" class="box-text">Agendar atendimento</text>
  <ellipse cx="640" cy="425" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="640" y="425" text-anchor="middle" class="box-text">Finalizar pedido</text>
  <ellipse cx="885" cy="425" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="885" y="425" text-anchor="middle" class="box-text">Acompanhar pedido</text>
  <ellipse cx="395" cy="545" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="395" y="545" text-anchor="middle" class="box-text">Criar conta e entrar</text>
  <ellipse cx="640" cy="545" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="640" y="545" text-anchor="middle" class="box-text">Recuperar senha</text>
  <ellipse cx="885" cy="545" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="885" y="545" text-anchor="middle" class="box-text">Avaliar cupcake</text>
  <ellipse cx="430" cy="705" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="430" y="705" text-anchor="middle" class="box-text">Gerenciar produtos</text>
  <ellipse cx="675" cy="705" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="675" y="705" text-anchor="middle" class="box-text">Gerenciar estoque</text>
  <ellipse cx="920" cy="705" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="920" y="705" text-anchor="middle" class="box-text">Gerenciar pedidos</text>
  <ellipse cx="430" cy="790" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="430" y="782" text-anchor="middle" class="box-text">Configurar entregas</text>
  <text x="430" y="800" text-anchor="middle" class="box-text">e horários</text>
  <ellipse cx="675" cy="790" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="675" y="782" text-anchor="middle" class="box-text">Gerenciar cupons,</text>
  <text x="675" y="800" text-anchor="middle" class="box-text">clientes e relatórios</text>
  <ellipse cx="920" cy="790" rx="125" ry="34" fill="#eaf4f6" stroke="#1f6573" stroke-width="2"/>
  <text x="920" y="790" text-anchor="middle" class="box-text">Moderar avaliações</text>
  <line x1="132" y1="255" x2="270" y2="185" stroke="#7b929b" stroke-width="2"/>
  <line x1="132" y1="255" x2="270" y2="305" stroke="#7b929b" stroke-width="2"/>
  <line x1="132" y1="255" x2="270" y2="425" stroke="#7b929b" stroke-width="2"/>
  <line x1="132" y1="255" x2="270" y2="545" stroke="#7b929b" stroke-width="2"/>
  <line x1="1149" y1="255" x2="1010" y2="705" stroke="#7b929b" stroke-width="2"/>
  <line x1="1149" y1="255" x2="1010" y2="790" stroke="#7b929b" stroke-width="2"/>
  <line x1="1149" y1="255" x2="1010" y2="545" stroke="#7b929b" stroke-width="2"/>
  <line x1="395" y1="221" x2="395" y2="269" stroke="#8ca1a9" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="403" y="245.0" class="small">«include»</text>
  <line x1="640" y1="221" x2="640" y2="269" stroke="#8ca1a9" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="648" y="245.0" class="small">«include»</text>
  <line x1="395" y1="341" x2="395" y2="389" stroke="#8ca1a9" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="403" y="365.0" class="small">«include»</text>
  <line x1="885" y1="341" x2="885" y2="389" stroke="#8ca1a9" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="893" y="365.0" class="small">«include»</text>
  <line x1="640" y1="509" x2="640" y2="461" stroke="#8ca1a9" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="648" y="485.0" class="small">«extend»</text>
  <line x1="885" y1="509" x2="885" y2="461" stroke="#8ca1a9" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="893" y="485.0" class="small">«extend»</text>
  <text x="36" y="852" class="note">Fluxos de pagamento permanecem demonstrativos; o segundo ator concentra apenas recursos administrativos.</text>
</svg>