  <text x="988" y="525" class="box-title">Observações</text>
  <text x="988" y="548" class="box-text">• ItemPedido referencia exatamente um Cupcake ou um Combo.</text>
  <text x="988" y="570" class="box-text">• CupomUtilizacao registra o uso de um cupom em, no máximo, um pedido.</text>
  <text x="988" y="592" class="box-text">• Pagamento e Avaliacao dependem de Pedido e Cupcake, sem ligação direta entre si.</text>
  <text x="36" y="952" class="note">Diagrama simplificado: preserva as relações centrais do domínio e evita associações inexistentes no esquema.</text>
