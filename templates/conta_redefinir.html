{% extends 'base.html' %}
{% block title %}Redefinir senha{% endblock %}
{% block content %}<div class="container inner-page"><div class="login-card"><h1>Redefinir senha</h1>{% if error %}<p role="alert" class="flash flash-erro">{{ error }}</p>{% endif %}{% if valid %}<form method="post" action="/conta/redefinir/{{ token }}" class="form-panel"><input type="hidden" name="_csrf" value="{{ csrf }}"><div class="field"><label for="senha">Nova senha (12 a 128 caracteres)</label><input id="senha" type="password" name="senha" minlength="12" maxlength="128" autocomplete="new-password" required></div><div class="field"><label for="confirmar">Confirme a senha</label><input id="confirmar" type="password" name="confirmar" minlength="12" maxlength="128" autocomplete="new-password" required></div><button class="btn btn-primary">Salvar nova senha</button></form>{% else %}<p>O link é inválido, expirou ou já foi usado.</p><p><a href="/conta/recuperar">Solicitar outro link</a></p>{% endif %}</div></div>{% endblock %}
