{% extends 'base.html' %}
{% block title %}Entrar na conta{% endblock %}
{% block content %}<div class="container inner-page"><div class="login-card"><span class="eyebrow">ÁREA DO CLIENTE</span><h1>Minha conta</h1><p>Acesse para ver seus pedidos.</p>{% if error %}<p class="flash flash-erro" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/conta/entrar" class="form-panel"><input type="hidden" name="_csrf" value="{{ csrf }}"><div class="field"><label for="email">E-mail</label><input id="email" type="email" name="email" autocomplete="username" required></div><div class="field"><label for="senha">Senha</label><input id="senha" type="password" name="senha" autocomplete="current-password" required></div><button class="btn btn-primary btn-full">Entrar</button></form><p><a href="/conta/recuperar">Esqueci minha senha</a></p><p>Primeira visita? <a href="/conta/cadastrar">Criar uma conta</a></p></div></div>{% endblock %}
