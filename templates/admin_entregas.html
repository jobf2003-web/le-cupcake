{% extends 'base.html' %}
{% block title %}Opções de entrega{% endblock %}
{% block content %}<div class="container inner-page admin-page"><a class="breadcrumb" href="/admin">← Painel</a><div class="page-header"><span class="eyebrow">ENTREGA E RETIRADA</span><h1>Modalidades disponíveis</h1></div><div class="stack">{% for op in options %}<div class="form-panel"><h2>{{ 'Entrega' if op.tipo=='entrega' else 'Retirada' }}</h2><form method="post" action="/admin/entregas/{{ op.id }}/salvar"><input type="hidden" name="_csrf" value="{{ csrf }}"><div class="field-grid"><div class="field"><label>Descrição</label><input name="descricao" maxlength="100" value="{{ op.descricao }}" required></div><div class="field"><label>Taxa (R$)</label><input name="custo" value="{{ ('%.2f' % (op.custo_base_centavos/100))|replace('.', ',') }}" required></div></div><label class="check-inline"><input type="checkbox" name="ativo" value="1" {% if op.ativa %}checked{% endif %}> Modalidade ativa</label><div class="section-actions"><button class="btn btn-primary">Salvar alterações</button></div></form></div>{% endfor %}</div></div>{% endblock %}
