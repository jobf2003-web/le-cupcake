{% extends 'base.html' %}
{% block title %}Criar conta{% endblock %}
{% block content %}<div class="container inner-page"><div class="login-card"><span class="eyebrow">BEM-VINDO</span><h1>Criar minha conta</h1><p>Crie uma conta para acompanhar seus pedidos.</p>{% if error %}<p class="flash flash-erro" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/conta/cadastrar" class="form-panel"><input type="hidden" name="_csrf" value="{{ csrf }}"><div class="field"><label for="nome">Nome</label><input id="nome" name="nome" value="{{ values.get('nome','') }}" minlength="3" maxlength="100" autocomplete="name" required></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ values.get('email','') }}" autocomplete="email" required></div><div class="field"><label for="senha">Senha (mínimo de 12 caracteres)</label><input id="senha" type="password" name="senha" minlength="12" maxlength="128" autocomplete="new-password" required></div><button class="btn btn-primary btn-full">Criar conta</button></form><p>Já tem cadastro? <a href="/conta/entrar">Entrar</a></p></div></div>{% endblock %}
