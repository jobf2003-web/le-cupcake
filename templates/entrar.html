{% extends 'base.html' %}
{% block title %}Administração · Entrar{% endblock %}
{% block content %}<div class="container inner-page"><div class="login-card"><span class="eyebrow">ÁREA RESTRITA</span><h1>Acesso administrativo</h1><p>Entre com a conta de administração criada na configuração do sistema.</p>{% if error %}<p class="flash flash-erro" role="alert">{{ error }}</p>{% endif %}<form action="/entrar" method="post" class="form-panel"><input type="hidden" name="_csrf" value="{{ csrf }}"><div class="field"><label for="email">E-mail</label><input id="email" type="email" name="email" autocomplete="username" required></div><div class="field"><label for="senha">Senha</label><input id="senha" type="password" name="senha" autocomplete="current-password" required></div><button class="btn btn-primary btn-full" type="submit">Entrar</button></form></div></div>{% endblock %}
